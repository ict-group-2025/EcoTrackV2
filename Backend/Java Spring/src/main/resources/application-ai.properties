# AI Configuration Properties
ai.python.executable=python
ai.python.script.path=../../AI/predict_for_java.py

# AI Model Settings
ai.model.lstm.path=../../AI/lstm_hourly_model.keras
ai.model.rf.path=../../AI/rf_daily_model.pkl
ai.scaler.path=../../AI/scaler_hourly.pkl

# AI Forecast Settings
ai.forecast.hours=24
ai.forecast.confidence.threshold=0.7
ai.forecast.cleanup.days=30

# AI Retraining Settings
ai.retraining.enabled=false
ai.retraining.schedule=0 0 2 * * *  # 2 AM daily
ai.retraining.days.old=7
